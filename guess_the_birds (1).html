<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Birds</title>
<style>
  :root{
    --sky-top:#bfe3f7;
    --sky-bottom:#e8f4ee;
    --ink:#1f2d24;
    --accent:#3f8f5f;
    --error:#c65b4e;
    --paper:#fffdf7;
    --love:#d1436b;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color:var(--ink);
    overflow:hidden;
  }
  #stage{
    height:100%;
    width:100%;
    position:relative;
    z-index:1;
  }
  .bg-photo{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s ease;
  }
  .bg-photo.active{
    opacity:1;
  }
  .bg-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%) contrast(1.05);
    opacity:0.1;
  }
  .bg-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--love);
    mix-blend-mode:color;
    opacity:0.45;
  }
  #hearts{
    position:fixed;
    inset:0;
    z-index:2;
    overflow:hidden;
    pointer-events:none;
  }
  .heart{
    position:absolute;
    bottom:-10vh;
    color:#ffffff;
    opacity:0;
    line-height:1;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    will-change:transform, opacity;
  }
  @keyframes floatUp{
    0%{ transform:translate(0, 0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--peak-opacity, 0.35); }
    90%{ opacity:var(--peak-opacity, 0.35); }
    100%{ transform:translate(var(--drift), -115vh) rotate(var(--rot)); opacity:0; }
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.7s ease;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---- Slide 1 ---- */
  .bird-frame{
    width:min(78vw, 380px);
    aspect-ratio:1/1;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.18);
    border:6px solid var(--paper);
    margin-bottom:26px;
  }
  .bird-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .question{
    font-size:1.15rem;
    margin-bottom:18px;
    text-align:center;
    font-weight:600;
  }
  .answer-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  #guess-input{
    font-family:inherit;
    font-size:1.05rem;
    padding:12px 16px;
    border-radius:999px;
    border:2px solid #cfd9d1;
    outline:none;
    width:min(60vw, 260px);
    background:var(--paper);
    color:var(--ink);
    transition:border-color 0.2s ease;
  }
  #guess-input:focus{
    border-color:var(--accent);
  }
  #guess-btn{
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    padding:12px 20px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  #guess-btn:hover{
    background:#357851;
  }
  #guess-btn:active{
    transform:scale(0.96);
  }
  .feedback{
    margin-top:16px;
    min-height:1.4em;
    font-size:1rem;
  }
  .feedback.correct{ color:var(--accent); font-weight:600; }
  .feedback.wrong{ color:var(--error); }

  @keyframes shake{
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .shake{
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    border-color: var(--error) !important;
  }

  /* ---- Slide 2 : word fade-in ---- */
  #reveal-text{
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    text-align:center;
    line-height:1.4;
    font-weight:600;
  }
  #reveal-text .word{
    display:inline-block;
    opacity:0;
    transform:translateY(10px);
    filter:blur(2px);
    transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }
  #reveal-text .word.shown{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
  #reveal-text .word.fading-out{
    opacity:0 !important;
    transition:opacity 0.9s ease;
  }
  #reveal-text .word.spacer::after{
    content:" ";
  }
  #reveal-text .love-word{
    color:var(--love);
    font-weight:700;
  }
  #reveal-text .glue-word{
    margin-left:0;
  }

  /* invisible-but-hidden variant used once love starts flying */
  #reveal-text .word.ghost{
    opacity:0;
    transition:none;
  }

  /* ---- Slide 3 : love flies in and settles into new headline ---- */
  #final-wrap{
    position:relative;
    text-align:center;
    min-height:160px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #final-headline{
    font-size:clamp(1.8rem, 6vw, 3rem);
    display:flex;
    align-items:baseline;
    gap:0.3em;
    flex-wrap:wrap;
    justify-content:center;
    font-weight:700;
  }
  #final-headline span{
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  #final-headline span.shown{
    opacity:1;
    transform:translateY(0);
  }
  #final-headline .love-final{
    color:var(--love);
  }
  #subline{
    margin-top:14px;
    font-size:1rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline.shown{
    opacity:1;
  }
  #subline2{
    margin-top:6px;
    font-size:0.9rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline2.shown{
    opacity:1;
  }

  /* the flying clone of "love" that travels between slides */
  #love-flyer{
    position:fixed;
    top:0;
    left:0;
    margin:0;
    padding:0;
    color:var(--love);
    font-weight:700;
    white-space:nowrap;
    pointer-events:none;
    z-index:50;
    transform-origin:top left;
    transition:top 0.85s cubic-bezier(.5,0,.2,1), left 0.85s cubic-bezier(.5,0,.2,1), font-size 0.85s cubic-bezier(.5,0,.2,1);
  }
</style>
</head>

    </div>
    <div class="question">Which birds are these?</div>
    <div class="answer-row">
      <input type="text" id="guess-input" placeholder="Type your guess..." autocomplete="off">
      <button id="guess-btn">Guess</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- SLIDE 2: They are... lovebirds -->
  <div class="slide" id="slide-2">
    <div id="reveal-text"></div>
  </div>

  <!-- SLIDE 3: Happy Birthday with love -->
  <div class="slide" id="slide-3">
    <div id="final-wrap">
      <div id="final-headline"></div>
      <div id="subline">collegial love btw</div>
      <div id="subline2">or Happy Bird-day 🥁</div>
    </div>
  </div>

</div>

<script>
(function(){
  const slide1 = document.getElementById('slide-1');
  const slide2 = document.getElementById('slide-2');
  const slide3 = document.getElementById('slide-3');
  const input = document.getElementById('guess-input');
  const btn = document.getElementById('guess-btn');
  const feedback = document.getElementById('feedback');

  function isBeeEaterGuess(raw){
    const t = raw.toLowerCase();
    const normalized = t.replace(/[-\s]/g, '');
    return normalized.includes('beeeater');
  }

  function handleGuess(){
    const val = input.value.trim();
    if(!val) return;
    if(isBeeEaterGuess(val)){
      feedback.textContent = "You're close.";
      feedback.className = 'feedback correct';
      btn.disabled = true;
      input.disabled = true;
      startHearts();
      setTimeout(()=>{
        slide1.classList.remove('active');
        slide2.classList.add('active');
        startWordReveal();
      }, 1100);
    } else {
      feedback.textContent = "That's not quite it — try again.";
      feedback.className = 'feedback wrong';
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      setTimeout(()=> input.classList.remove('shake'), 500);
    }
  }

  // ---------- Floating hearts (start once the answer is submitted correctly) ----------
  let heartsTimer = null;
  function spawnHeart(){
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = '♥';

    const size = 14 + Math.random() * 22; // 14–36px
    const left = Math.random() * 100; // vw %
    const duration = 6 + Math.random() * 5; // 6–11s
    const drift = (Math.random() * 120 - 60) + 'px';
    const rot = (Math.random() * 40 - 20) + 'deg';
    const peakOpacity = 0.2 + Math.random() * 0.25; // 0.2–0.45

    el.style.left = left + 'vw';
    el.style.fontSize = size + 'px';
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--drift', drift);
    el.style.setProperty('--rot', rot);
    el.style.setProperty('--peak-opacity', peakOpacity);

    document.getElementById('hearts').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function startHearts(){
    if(heartsTimer) return;
    document.querySelector('.bg-photo').classList.add('active');
    spawnHeart();
    heartsTimer = setInterval(spawnHeart, 380);
  }

  btn.addEventListener('click', handleGuess);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleGuess();
  });

  // ---------- Slide 2: word-by-word fade in ----------
  let loveSourceEl = null;

  function startWordReveal(){
    const container = document.getElementById('reveal-text');
    container.innerHTML = '';

    // "They" "are..." "love" "birds." — love+birds sit glued together as "lovebirds."
    const specs = [
      { text: "They", glue:false, love:false },
      { text: "are...", glue:false, love:false },
      { text: "love", glue:false, love:true },
      { text: "birds.", glue:true, love:false }
    ];

    const wordEls = [];
    specs.forEach((s) => {
      const span = document.createElement('span');
      span.className = 'word';
      if(s.glue) span.classList.add('glue-word');
      if(s.love){
        span.classList.add('love-word');
        loveSourceEl = span;
      } else if(!s.glue){
        span.classList.add('spacer');
      }
      span.textContent = s.text;
      container.appendChild(span);
      wordEls.push(span);
    });

    wordEls.forEach((el, i) => {
      setTimeout(()=> el.classList.add('shown'), 400 + i * 450);
    });

    const totalRevealTime = 400 + specs.length * 450;

    // hold, then fade everything out except "love"
    setTimeout(()=>{
      wordEls.forEach(el => {
        if(el !== loveSourceEl){
          el.classList.add('fading-out');
        }
      });
    }, totalRevealTime + 900);

    // once faded, fly "love" over to slide 3
    setTimeout(()=>{
      flyLoveToSlide3();
    }, totalRevealTime + 1900);
  }

  // ---------- Fly "love" from slide 2 into slide 3's headline ----------
  function flyLoveToSlide3(){
    // 1) measure where "love" currently sits
    const startRect = loveSourceEl.getBoundingClientRect();
    const startStyle = window.getComputedStyle(loveSourceEl);
    const startFontSize = startStyle.fontSize;

    // 2) build slide 3's headline (invisible spans, but laid out) so we can
    //    measure where "love." needs to land
    const headline = document.getElementById('final-headline');
    headline.innerHTML = '';
    const subline = document.getElementById('subline');
    subline.classList.remove('shown');
    const subline2 = document.getElementById('subline2');
    subline2.classList.remove('shown');

    const parts = [
      { text: "Happy", cls: "" },
      { text: "Birthday!", cls: "" },
      { text: "with", cls: "" },
      { text: "love.", cls: "love-final" }
    ];
    let targetEl = null;
    parts.forEach(p => {
      const span = document.createElement('span');
      span.textContent = p.text;
      if(p.cls){
        span.classList.add(p.cls);
        targetEl = span;
      }
      headline.appendChild(span);
    });

    // make slide 3 visible so layout resolves, but keep its words invisible for now
    slide3.classList.add('active');

    // 3) measure target position (after layout)
    requestAnimationFrame(() => {
      const targetRect = targetEl.getBoundingClientRect();
      const targetStyle = window.getComputedStyle(targetEl);
      const targetFontSize = targetStyle.fontSize;

      // 4) create the flying clone at love's current screen position
      const flyer = document.createElement('div');
      flyer.id = 'love-flyer';
      flyer.textContent = 'love';
      flyer.style.top = startRect.top + 'px';
      flyer.style.left = startRect.left + 'px';
      flyer.style.fontSize = startFontSize;
      document.body.appendChild(flyer);

      // hide the originals so only the flyer is visible mid-flight
      loveSourceEl.classList.add('ghost');
      slide2.classList.remove('active');

      // 5) next frame, animate the flyer to the target position
      requestAnimationFrame(() => {
        flyer.style.top = targetRect.top + 'px';
        flyer.style.left = targetRect.left + 'px';
        flyer.style.fontSize = targetFontSize;
      });

      // 6) once it lands, swap in the real target span and reveal the rest
      setTimeout(() => {
        flyer.remove();
        targetEl.classList.add('shown');

        const others = Array.from(headline.querySelectorAll('span')).filter(s => s !== targetEl);
        others.forEach((el, i) => {
          setTimeout(()=> el.classList.add('shown'), i * 150);
        });

        setTimeout(()=>{
          subline.classList.add('shown');
        }, 2000);

        setTimeout(()=>{
          subline2.classList.add('shown');
        }, 4000);
      }, 900);
    });
  }
})();
</script>
