<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Birds</title>
<style>
  :root{
    --sky-top:#bfe3f7;
    --sky-bottom:#e8f4ee;
    --ink:#1f2d24;
    --accent:#3f8f5f;
    --error:#c65b4e;
    --paper:#fffdf7;
    --love:#d1436b;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color:var(--ink);
    overflow:hidden;
  }
  #stage{
    height:100%;
    width:100%;
    position:relative;
    z-index:1;
  }
  .bg-photo{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.8s ease;
  }
  .bg-photo.active{
    opacity:1;
  }
  .bg-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%) contrast(1.05);
    opacity:0.1;
  }
  .bg-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--love);
    mix-blend-mode:color;
    opacity:0.45;
  }
  #hearts{
    position:fixed;
    inset:0;
    z-index:2;
    overflow:hidden;
    pointer-events:none;
  }
  .heart{
    position:absolute;
    bottom:-10vh;
    color:#ffffff;
    opacity:0;
    line-height:1;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    will-change:transform, opacity;
  }
  @keyframes floatUp{
    0%{ transform:translate(0, 0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--peak-opacity, 0.35); }
    90%{ opacity:var(--peak-opacity, 0.35); }
    100%{ transform:translate(var(--drift), -115vh) rotate(var(--rot)); opacity:0; }
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.7s ease;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---- Question slides (sparrow / magpie / bee-eater) ---- */
  .bird-frame{
    width:min(78vw, 380px);
    aspect-ratio:1/1;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.18);
    border:6px solid var(--paper);
    margin-bottom:26px;
  }
  .bird-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .question{
    font-size:1.15rem;
    margin-bottom:18px;
    text-align:center;
    font-weight:600;
  }
  .answer-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .guess-input{
    font-family:inherit;
    font-size:1.05rem;
    padding:12px 16px;
    border-radius:999px;
    border:2px solid #cfd9d1;
    outline:none;
    width:min(60vw, 260px);
    background:var(--paper);
    color:var(--ink);
    transition:border-color 0.2s ease;
  }
  .guess-input:focus{
    border-color:var(--accent);
  }
  .guess-btn{
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    padding:12px 20px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .guess-btn:hover{
    background:#357851;
  }
  .guess-btn:active{
    transform:scale(0.96);
  }
  .feedback{
    margin-top:16px;
    min-height:1.4em;
    font-size:1rem;
  }
  .feedback.correct{ color:var(--accent); font-weight:600; }
  .feedback.wrong{ color:var(--error); }

  @keyframes shake{
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .shake{
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    border-color: var(--error) !important;
  }

  /* ---- Slide: word fade-in ---- */
  #reveal-text{
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    text-align:center;
    line-height:1.4;
    font-weight:600;
  }
  #reveal-text .word{
    display:inline-block;
    opacity:0;
    transform:translateY(10px);
    filter:blur(2px);
    transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }
  #reveal-text .word.shown{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
  #reveal-text .word.fading-out{
    opacity:0 !important;
    transition:opacity 0.9s ease;
  }
  #reveal-text .word.spacer::after{
    content:" ";
  }
  #reveal-text .love-word{
    color:var(--love);
    font-weight:700;
  }
  #reveal-text .glue-word{
    margin-left:0;
  }
  #reveal-text .word.ghost{
    opacity:0;
    transition:none;
  }

  /* ---- Slide: love flies in and settles into new headline ---- */
  #final-wrap{
    position:relative;
    text-align:center;
    min-height:160px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #final-headline{
    font-size:clamp(1.8rem, 6vw, 3rem);
    display:flex;
    align-items:baseline;
    gap:0.3em;
    flex-wrap:wrap;
    justify-content:center;
    font-weight:700;
  }
  #final-headline span{
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  #final-headline span.shown{
    opacity:1;
    transform:translateY(0);
  }
  #final-headline .love-final{
    color:var(--love);
  }
  #subline{
    margin-top:14px;
    font-size:1rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline.shown{
    opacity:1;
  }
  #subline2{
    margin-top:6px;
    font-size:0.9rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline2.shown{
    opacity:1;
  }

  /* ---- Finale: blackout, confetti, danmaku, disco, gifs ---- */
  #finale{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
    overflow:hidden;
  }
  #finale.active{
    opacity:1;
    pointer-events:auto;
  }
  #disco-layer, #gif-layer, #confetti-layer, #danmaku-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .then-now-wrap{
    position:absolute;
    inset:0;
    z-index:150;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8vw;
    pointer-events:none;
  }
  .then-now-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transition:opacity 1s ease;
  }
  .then-now-item.shown{
    opacity:1;
  }
  .then-now-item img{
    width:min(38vw, 260px);
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:16px;
  }
  .then-now-item .label{
    margin-top:14px;
    color:#fff;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  #disco-layer{
    background:conic-gradient(from 0deg, #ff004c, #ffb400, #38ff8a, #00d4ff, #7b2ff7, #ff004c);
    mix-blend-mode:screen;
    opacity:0;
    filter:blur(30px);
    animation:discoSpin 6s linear infinite;
    transform-origin:center;
    transition:opacity 1s ease;
  }
  #disco-layer.active{
    opacity:0.35;
  }
  #disco-layer::after{
    content:"";
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.28), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.22), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,255,255,0.18), transparent 35%);
    animation:discoPulse 2.6s ease-in-out infinite alternate;
  }
  @keyframes discoSpin{
    from{ transform:rotate(0deg) scale(1.5); }
    to{ transform:rotate(360deg) scale(1.5); }
  }
  @keyframes discoPulse{
    from{ opacity:0.25; }
    to{ opacity:0.75; }
  }
  .gif-slot{
    position:absolute;
    opacity:0;
    transition:opacity 0.6s ease;
    border-radius:14px;
    box-shadow:0 12px 34px rgba(0,0,0,0.55);
  }
  .confetti-piece{
    position:absolute;
    top:-6vh;
    opacity:0;
    animation-name:confettiFall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translate(var(--drift), 115vh) rotate(var(--rot)); opacity:0; }
  }
  .danmaku-item{
    position:absolute;
    left:-25%;
    white-space:nowrap;
    font-weight:800;
    text-shadow:0 0 10px rgba(0,0,0,0.6), 0 0 2px rgba(0,0,0,0.8);
    animation-name:danmakuMove;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes danmakuMove{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(150vw); }
  }

  /* the flying clone of "love" that travels between slides */
  #love-flyer{
    position:fixed;
    top:0;
    left:0;
    margin:0;
    padding:0;
    color:var(--love);
    font-weight:700;
    white-space:nowrap;
    pointer-events:none;
    z-index:50;
    transform-origin:top left;
    transition:top 0.85s cubic-bezier(.5,0,.2,1), left 0.85s cubic-bezier(.5,0,.2,1), font-size 0.85s cubic-bezier(.5,0,.2,1);
  }
</style>
</head>

<script>
(function(){
  const slide2 = document.getElementById('slide-2');
  const slide3 = document.getElementById('slide-3');
  const bgm = document.getElementById('bgm');

  // ---------- Question flow config ----------
  // each question: which slide it lives on, how to check the answer, and what happens next
  const questions = [
    {
      slideId: 'slide-q1',
      check: (t) => t.includes('sparrow'),
      correctMsg: "Correct!",
      next: () => goToSlide('slide-q2')
    },
    {
      slideId: 'slide-q2',
      check: (t) => t.includes('magpie'),
      correctMsg: "Correct!",
      next: () => goToSlide('slide-q3')
    },
    {
      slideId: 'slide-q3',
      check: (t) => t.replace(/[-\s]/g, '').includes('beeeater'),
      correctMsg: "You're close.",
      next: () => {
        startHearts();
        goToSlide('slide-2');
        startWordReveal();
      }
    }
  ];

  function goToSlide(id){
    document.querySelectorAll('.slide.active').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  questions.forEach(q => {
    const slideEl = document.getElementById(q.slideId);
    const input = slideEl.querySelector('.guess-input');
    const btn = slideEl.querySelector('.guess-btn');
    const feedback = slideEl.querySelector('.feedback');

    function handleGuess(){
      const val = input.value.trim();
      if(!val) return;
      const normalized = val.toLowerCase();
      if(q.check(normalized)){
        feedback.textContent = q.correctMsg;
        feedback.className = 'feedback correct';
        btn.disabled = true;
        input.disabled = true;
        setTimeout(q.next, 1100);
      } else {
        feedback.textContent = "That's not quite it — try again.";
        feedback.className = 'feedback wrong';
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');
        setTimeout(()=> input.classList.remove('shake'), 500);
      }
    }

    btn.addEventListener('click', handleGuess);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter') handleGuess();
    });
  });

  // ---------- Floating hearts + bg music (start once bee-eaters answer is submitted) ----------
  let heartsTimer = null;
  function spawnHeart(){
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = '♥';

    const size = 14 + Math.random() * 22; // 14–36px
    const left = Math.random() * 100; // vw %
    const duration = 6 + Math.random() * 5; // 6–11s
    const drift = (Math.random() * 120 - 60) + 'px';
    const rot = (Math.random() * 40 - 20) + 'deg';
    const peakOpacity = 0.2 + Math.random() * 0.25; // 0.2–0.45

    el.style.left = left + 'vw';
    el.style.fontSize = size + 'px';
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--drift', drift);
    el.style.setProperty('--rot', rot);
    el.style.setProperty('--peak-opacity', peakOpacity);

    document.getElementById('hearts').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function startHearts(){
    if(heartsTimer) return;
    document.querySelector('.bg-photo').classList.add('active');
    spawnHeart();
    heartsTimer = setInterval(spawnHeart, 380);
    bgm.volume = 0.5;
    bgm.play().catch(()=>{ /* ignored if browser blocks autoplay */ });
  }

  // ---------- Slide: word-by-word fade in ----------
  let loveSourceEl = null;

  function startWordReveal(){
    const container = document.getElementById('reveal-text');
    container.innerHTML = '';

    // "They" "are..." "love" "birds." — love+birds sit glued together as "lovebirds."
    const specs = [
      { text: "They", glue:false, love:false },
      { text: "are...", glue:false, love:false },
      { text: "love", glue:false, love:true },
      { text: "birds.", glue:true, love:false }
    ];

    const wordEls = [];
    specs.forEach((s) => {
      const span = document.createElement('span');
      span.className = 'word';
      if(s.glue) span.classList.add('glue-word');
      if(s.love){
        span.classList.add('love-word');
        loveSourceEl = span;
      } else if(!s.glue){
        span.classList.add('spacer');
      }
      span.textContent = s.text;
      container.appendChild(span);
      wordEls.push(span);
    });

    wordEls.forEach((el, i) => {
      setTimeout(()=> el.classList.add('shown'), 400 + i * 450);
    });

    const totalRevealTime = 400 + specs.length * 450;

    // hold, then fade everything out except "love"
    setTimeout(()=>{
      wordEls.forEach(el => {
        if(el !== loveSourceEl){
          el.classList.add('fading-out');
        }
      });
    }, totalRevealTime + 900);

    // once faded, fly "love" over to slide 3
    setTimeout(()=>{
      flyLoveToSlide3();
    }, totalRevealTime + 1900);
  }

  // ---------- Fly "love" from slide 2 into slide 3's headline ----------
  function flyLoveToSlide3(){
    // 1) measure where "love" currently sits
    const startRect = loveSourceEl.getBoundingClientRect();
    const startStyle = window.getComputedStyle(loveSourceEl);
    const startFontSize = startStyle.fontSize;

    // 2) build slide 3's headline (invisible spans, but laid out) so we can
    //    measure where "love." needs to land
    const headline = document.getElementById('final-headline');
    headline.innerHTML = '';
    const subline = document.getElementById('subline');
    subline.classList.remove('shown');
    const subline2 = document.getElementById('subline2');
    subline2.classList.remove('shown');

    const parts = [
      { text: "Happy", cls: "" },
      { text: "Birthday!", cls: "" },
      { text: "with", cls: "" },
      { text: "love.", cls: "love-final" }
    ];
    let targetEl = null;
    parts.forEach(p => {
      const span = document.createElement('span');
      span.textContent = p.text;
      if(p.cls){
        span.classList.add(p.cls);
        targetEl = span;
      }
      headline.appendChild(span);
    });

    // make slide 3 visible so layout resolves, but keep its words invisible for now
    slide3.classList.add('active');

    // 3) measure target position (after layout)
    requestAnimationFrame(() => {
      const targetRect = targetEl.getBoundingClientRect();
      const targetStyle = window.getComputedStyle(targetEl);
      const targetFontSize = targetStyle.fontSize;

      // 4) create the flying clone at love's current screen position
      const flyer = document.createElement('div');
      flyer.id = 'love-flyer';
      flyer.textContent = 'love';
      flyer.style.top = startRect.top + 'px';
      flyer.style.left = startRect.left + 'px';
      flyer.style.fontSize = startFontSize;
      document.body.appendChild(flyer);

      // hide the originals so only the flyer is visible mid-flight
      loveSourceEl.classList.add('ghost');
      slide2.classList.remove('active');

      // 5) next frame, animate the flyer to the target position
      requestAnimationFrame(() => {
        flyer.style.top = targetRect.top + 'px';
        flyer.style.left = targetRect.left + 'px';
        flyer.style.fontSize = targetFontSize;
      });

      // 6) once it lands, swap in the real target span and reveal the rest
      setTimeout(() => {
        flyer.remove();
        targetEl.classList.add('shown');

        const others = Array.from(headline.querySelectorAll('span')).filter(s => s !== targetEl);
        others.forEach((el, i) => {
          setTimeout(()=> el.classList.add('shown'), i * 150);
        });

        setTimeout(()=>{
          subline.classList.add('shown');
        }, 2000);

        setTimeout(()=>{
          subline2.classList.add('shown');
        }, 4000);

        // 3 seconds after the last text (subline2) appears, show the Then/Now interlude
        setTimeout(showThenNow, 4000 + 3000);
      }, 900);
    });
  }

  // ---------- Finale: blackout, confetti, danmaku, disco, gifs ----------
  const finale = document.getElementById('finale');
  const hpbd = document.getElementById('hpbd');
  const gifSlots = Array.from(document.querySelectorAll('.gif-slot'));
  const gifUrls = [1,2,3,4,5,6].map(n => `https://raw.githubusercontent.com/phuongm1409/bird/main/${n}.gif`);
  const brightColors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#ff4dd8','#3ddc97'];
  const danmakuMessages = [
    'Happy Birthday sếp Will',
    'Chúc mừng sinh nhật sếp Will',
    'Chucs muwng sinh nhaajt seps ưill',
    'from Na',
    'from Yen',
    'from Vy',
    'from phuong',
    'Sinh nhật vui vẻ',
    'Ngày mới an lành',
    'Hpbd Will',
    '20/8/1994',
    '20/8/2026',
    'Aug 20',
    '20th August 2026',
    '20th August 1994'
  ];

  let finaleActive = false;
  let confettiTimer = null;
  let danmakuTimer = null;

  function spawnConfetti(){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const w = 6 + Math.random() * 6;
    const h = w * (1.4 + Math.random() * 0.6);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.background = brightColors[Math.floor(Math.random() * brightColors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const duration = 4 + Math.random() * 4;
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
    el.style.setProperty('--rot', (720 + Math.random() * 720) + 'deg');
    document.getElementById('confetti-layer').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function spawnDanmaku(){
    const el = document.createElement('div');
    el.className = 'danmaku-item';
    el.textContent = danmakuMessages[Math.floor(Math.random() * danmakuMessages.length)];
    el.style.top = (5 + Math.random() * 85) + 'vh';
    el.style.fontSize = (20 + Math.random() * 26) + 'px';
    el.style.color = brightColors[Math.floor(Math.random() * brightColors.length)];
    const duration = 6 + Math.random() * 5;
    el.style.animationDuration = duration + 's';
    document.getElementById('danmaku-layer').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function runGifSlot(slotEl){
    function cycle(){
      if(!finaleActive) return;
      const url = gifUrls[Math.floor(Math.random() * gifUrls.length)];
      slotEl.src = url;
      const size = 110 + Math.random() * 90;
      slotEl.style.width = size + 'px';
      slotEl.style.top = (Math.random() * 65 + 5) + 'vh';
      slotEl.style.left = (Math.random() * 70 + 5) + 'vw';
      slotEl.style.opacity = '1';
      const visibleDuration = 1800 + Math.random() * 1600;
      setTimeout(() => {
        slotEl.style.opacity = '0';
        const hiddenDuration = 500 + Math.random() * 1600;
        setTimeout(cycle, hiddenDuration);
      }, visibleDuration);
    }
    // stagger the initial start so slots don't sync up
    setTimeout(cycle, Math.random() * 1200);
  }

  function startFinale(){
    finaleActive = true;
    finale.classList.add('active');
    document.getElementById('disco-layer').classList.add('active');

    bgm.pause();
    hpbd.currentTime = 0;
    hpbd.volume = 0.7;
    hpbd.play().catch(()=>{ /* ignored if browser blocks autoplay */ });

    spawnConfetti();
    confettiTimer = setInterval(spawnConfetti, 160);
    spawnDanmaku();
    danmakuTimer = setInterval(spawnDanmaku, 900);

    // gifs and other repo images join 5 seconds after hpbd.mp3 starts playing
    setTimeout(() => {
      if(!finaleActive) return;
      gifSlots.forEach(runGifSlot);
    }, 5000);
  }

  function showThenNow(){
    const thenEl = document.getElementById('then-item');
    const nowEl = document.getElementById('now-item');

    // Phase 1: fade the whole screen to black first (1s)
    finale.classList.add('active');

    // Phase 2: once fully black, fade in the Then/Now images (1s)
    setTimeout(() => {
      thenEl.classList.add('shown');
      nowEl.classList.add('shown');
    }, 1000);

    // Phase 3: hold visible for 4s after the fade-in completes, then fade out (1s)
    setTimeout(() => {
      thenEl.classList.remove('shown');
      nowEl.classList.remove('shown');
    }, 1000 + 1000 + 4000);

    // Phase 4: once fully faded back to black, move into the party phase (hpbd.mp3 + confetti + gifs)
    setTimeout(() => {
      startFinale();
    }, 1000 + 1000 + 4000 + 1000);
  }

  function resetToStart(){
    finaleActive = false;
    finale.classList.remove('active');
    document.getElementById('disco-layer').classList.remove('active');

    clearInterval(confettiTimer); confettiTimer = null;
    clearInterval(danmakuTimer); danmakuTimer = null;
    document.getElementById('confetti-layer').innerHTML = '';
    document.getElementById('danmaku-layer').innerHTML = '';
    gifSlots.forEach(el => { el.style.opacity = '0'; el.src = ''; });
    document.getElementById('then-item').classList.remove('shown');
    document.getElementById('now-item').classList.remove('shown');

    hpbd.pause();
    hpbd.currentTime = 0;

    clearInterval(heartsTimer); heartsTimer = null;
    document.getElementById('hearts').innerHTML = '';
    document.querySelector('.bg-photo').classList.remove('active');

    // reset the quiz slides so the site can be replayed
    questions.forEach(q => {
      const slideEl = document.getElementById(q.slideId);
      const input = slideEl.querySelector('.guess-input');
      const btn = slideEl.querySelector('.guess-btn');
      const feedback = slideEl.querySelector('.feedback');
      input.value = '';
      input.disabled = false;
      btn.disabled = false;
      feedback.textContent = '';
      feedback.className = 'feedback';
    });

    document.getElementById('reveal-text').innerHTML = '';
    document.getElementById('final-headline').innerHTML = '';
    document.getElementById('subline').classList.remove('shown');
    document.getElementById('subline2').classList.remove('shown');

    goToSlide('slide-q1');
  }

  hpbd.addEventListener('ended', resetToStart);
})();
</script>
</body>
</html>
